name: CI

on:
  push:
    branches: [hidforge]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, audit and test
    runs-on: ubuntu-latest
    # Same image as the local build container.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Cache the xenon-forge bootstrap (DotSlash + Buck2)
        uses: actions/cache@v4
        with:
          path: .xenon-forge/.tools
          key: xenon-forge-tools-f369053666c0d56176c8fdefd7d87f3dcc168c63

      - name: Build both variants, audit the ELFs, run the desk test
        run: bash tools/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: hidforge-${{ github.sha }}
          path: dist/
